name: 社区装扮自动合并
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: community-submission-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取可信检查程序
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: 获取投稿数据
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: submission
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 检查投稿
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SUBMISSION_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          git -C submission fetch --no-tags https://github.com/kourou25/meme-hall-skins.git "$BASE_SHA"
          node --test trusted/tests/*.test.mjs
          node trusted/scripts/validate-snapshot.mjs submission "$BASE_SHA" "$HEAD_SHA"
      - name: 合并已检查的提交并启动目录发布
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node trusted/scripts/merge-submission.mjs
