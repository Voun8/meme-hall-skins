<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>装扮示例预览</title>
  <link rel="stylesheet" href="skin.css">
</head>
<body>
  <main class="preview">
    <h1>装扮示例预览</h1>
    <p>文字可以选择、复制和换行。调整窗口宽度检查手机显示。</p>
    <section aria-label="浅色主题">
      <h2>浅色主题</h2>
      <div class="scene"><span class="badge">徽章</span> <span class="title">称号</span><p class="bubble">一条聊天消息。长内容应当自然换行，不能遮住其他信息。</p><label>回应 <input class="reply" placeholder="写一句回应"></label></div>
    </section>
    <section class="dark" aria-label="深色主题">
      <h2>深色主题</h2>
      <div class="scene"><span class="badge">徽章</span> <span class="title">称号</span><p class="bubble">一条聊天消息。长内容应当自然换行，不能遮住其他信息。</p><label>回应 <input class="reply" placeholder="写一句回应"></label></div>
    </section>
  </main>
</body>
</html>
